name: Documentation issue
description: Report unclear, incorrect, or missing developer documentation
title: "[Docs] "
labels:
  - documentation
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same documentation problem.
          required: true

  - type: input
    id: location
    attributes:
      label: Page or source location
      description: Link the documentation page or repository file.
      placeholder: https://sixtyfold.dev/en/docs/...
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Incorrect information
        - Missing information
        - Unclear explanation
        - Broken or outdated code sample
        - Broken link or navigation
        - Accessibility or presentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What needs to change?
      description: Explain what is wrong or difficult to understand.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Propose corrected wording, code, or structure when you have one.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Attach screenshots or related links if they clarify the report.
