name: Contributor license agreement

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  acceptance:
    name: CLA v1.0 accepted
    runs-on: ubuntu-latest
    steps:
      - name: Verify pull-request affirmation
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node <<'NODE'
          const required =
            "- [x] I accept the Sixtyfold Contributor License Agreement Version 1.0 for this contribution.";
          const body = process.env.PR_BODY ?? "";

          if (!body.toLowerCase().includes(required.toLowerCase())) {
            console.error(
              "Check the CLA v1.0 acceptance box in the pull-request description before this contribution can be merged.",
            );
            process.exit(1);
          }

          console.log(
            JSON.stringify({
              agreement: "Sixtyfold Contributor License Agreement Version 1.0",
              acceptedBy: process.env.PR_AUTHOR,
              pullRequest: process.env.PR_NUMBER,
              contribution: process.env.PR_SHA,
            }),
          );
          NODE
